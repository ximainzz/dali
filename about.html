<div class="about-grid">
  <h1>关于大理</h1>
  <div>
    <p class="lead" style="font-size:16px;color:var(--ink);font-family:var(--serif);line-height:2">
      大理，位于云南西部，苍山十九屏列于西，洱海如镜悬于东。这里是南诏国与大理国的故都，是二十四个世居民族共同生活的地方，也是茶马古道上最重要的驿站之一。
    </p>
    <p style="margin-top:30px;color:var(--ink-soft)">
      我们是一群长期住在大理的写作者、向导与摄影师。「苍洱间」不是一个旅游平台，而是一本持续更新的在地手册——我们只写自己走过的路、住过的院子、吃过的早餐。
    </p>
    <div style="margin-top:40px;aspect-ratio:16/10;overflow:hidden"><img src="images/xizhou.jpg" alt="白族民居" style="width:100%;height:100%;object-fit:cover"></div>
